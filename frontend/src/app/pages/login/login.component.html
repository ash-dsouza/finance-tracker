<div class="wrapper">
         <div class="title">
            SpendWise
         </div>
         <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login100-form validate-form">

            <div class="field">
               <input [(ngModel)]="email" name="email" class="input100" type="text" placeholder="Email" required>
               <label>Email Address</label>
            </div>
            <div class="field">
               <input [(ngModel)]="password" name="password" class="input100" type="password" placeholder="Password" required>
               <label>Password</label>
            </div>
            <div class="content">
               <div class="checkbox">
                  <input type="checkbox" id="remember-me">
                  <label for="remember-me">Remember me</label>
               </div>
               <div class="pass-link">
                  <a href="#">Forgot password?</a>
               </div>
            </div>
            <div class="field">
               <input type="submit" value="Login">
            </div>
            <div class="signup-link">
               Not a member? <a href="#">Signup now</a>
            </div>
         </form>
      </div>
