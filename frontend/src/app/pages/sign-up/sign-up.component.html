<div class="wrapper">
  <div class="title">Create Account</div>
  <form (ngSubmit)="onSignup()" #signupForm="ngForm" class="signup-form">

    <div class="field">
      <input [(ngModel)]="name" name="name" class="input100" type="text" placeholder="Full Name" required>
      <label>Full Name</label>
    </div>

    <div class="field">
      <input [(ngModel)]="email" name="email" class="input100" type="email" placeholder="Email" required>
      <label>Email Address</label>
    </div>

    <div class="field">
      <input [(ngModel)]="password" name="password" class="input100" type="password" placeholder="Password" required>
      <label>Password</label>
    </div>

    <div class="field">
      <input [(ngModel)]="confirmPassword" name="confirmPassword" class="input100" type="password" placeholder="Confirm Password" required>
      <label>Confirm Password</label>
    </div>

    <div class="field">
      <input type="submit" value="Sign Up">
    </div>

    <div class="signup-link">
      Already have an account? <a routerLink="/login">Login here</a>
    </div>
  </form>
</div>
