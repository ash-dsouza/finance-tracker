<div class="card card-custom p-2 d-inline-block">
  <button class="btn btn-sm btn-primary" routerLink="/add-entry">Add Entry</button>
</div>

<div class="container mt-5">
  <!-- Info Cards -->
  <div class="row">
    <div class="col-md-4" *ngFor="let card of dashboardCards">
      <div class="card card-custom">
        <div class="card-body">
          <h5 class="card-title">{{ card.title }}</h5>
          <p class="display-6">{{ card.value }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bar Chart -->
  <div class="card card-custom">
    <div class="card-body">
      <canvas baseChart
              [data]="barChartData"
              [options]="barChartOptions"
              [type]="'bar'">
      </canvas>
    </div>
  </div>

  <!-- Recent Transactions -->
  <div class="card card-custom">
    <div class="card-header"><strong>Recent Transactions</strong></div>
    <div class="card-body p-0">
      <table class="table mb-0">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount (₹)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tx of transactions">
            <td>{{ tx.date }}</td>
            <td>{{ tx.desc }}</td>
            <td>{{ tx.amt }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
