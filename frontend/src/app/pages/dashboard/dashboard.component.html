<div class="container-fluid mt-4">
  <div class="row g-4">
    <!-- Info Cards -->
    <div class="col-md-4">
      <div class="card border-0 shadow-sm bg-gradient-primary text-white">
        <div class="card-body">
          <div class="d-flex align-items-center">
            <div class="me-3">
              <i class="bi bi-journal-check fs-1"></i>
            </div>
            <div>
              <h6 class="card-title mb-1">Total Entries</h6>
              <h4 class="mb-0">{{ totalEntries }}</h4>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border-0 shadow-sm bg-gradient-success text-white">
        <div class="card-body">
          <div class="d-flex align-items-center">
            <div class="me-3">
              <i class="bi bi-currency-rupee fs-1"></i>
            </div>
            <div>
              <h6 class="card-title mb-1">Monthly Spending</h6>
              <h4 class="mb-0">₹{{ monthlySpending }}</h4>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border-0 shadow-sm bg-gradient-info text-white">
        <div class="card-body">
          <div class="d-flex align-items-center">
            <div class="me-3">
              <i class="bi bi-calendar-date fs-1"></i>
            </div>
            <div>
              <h6 class="card-title mb-1">Today</h6>
              <h4 class="mb-0">{{ today | date: 'fullDate' }}</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart Card -->
  <div class="row my-4">
    <div class="col-lg-12">
      <div class="card shadow-sm">
        <div class="card-header bg-light">
          <h6 class="mb-0">Monthly Spending Overview</h6>
        </div>
        <div class="card-body">
          <canvas baseChart
            [data]="barChartData"
            [options]="barChartOptions"
            [type]="barChartType">
          </canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Transaction Table -->
  <div class="row">
    <div class="col-lg-12">
      <div class="card shadow-sm">
        <div class="card-header bg-light">
          <h6 class="mb-0">Recent Transactions</h6>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th class="text-end">Amount (₹)</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let tx of transactions">
                <td>{{ tx.date }}</td>
                <td>{{ tx.desc }}</td>
                <td class="text-end text-danger fw-bold">₹{{ tx.amt }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
